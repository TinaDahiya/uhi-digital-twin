[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uhi-digital-twin"
version = "0.1.0"
description = "Urban Heat Island (SUHII) digital twin for Indian cities - data acquisition, preprocessing, modelling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyyaml>=6.0", "pyarrow>=14"]

[project.optional-dependencies]
gee = ["earthengine-api>=0.1.390", "pyproj>=3.5"]
geo = ["shapely>=2.0"]
parquet = ["pyarrow>=14"]
notebook = ["jupyter>=1.0", "matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
